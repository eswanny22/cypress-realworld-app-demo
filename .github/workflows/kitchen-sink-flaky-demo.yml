name: Kitchen Sink Flaky Demo

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  kitchen-sink:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:22.20.0
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The action exits non-zero when any test fails after all retries,
      # which fails this job.
      - name: "Kitchen Sink Tests - Chrome"
        uses: cypress-io/github-action@v7
        with:
          browser: chrome
          config-file: cypress.kitchen-sink.config.ts
          record: ${{ secrets.CYPRESS_RECORD_KEY != '' }}
        env:
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
